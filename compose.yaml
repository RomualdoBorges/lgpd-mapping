name: lgpd
services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:?Defina DB_NAME em .env}
      POSTGRES_USER: lgpd_admin
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?Defina DB_ADMIN_PASSWORD em .env}
      DB_RUNTIME_USER: ${DB_RUNTIME_USER:?Defina DB_RUNTIME_USER em .env}
      DB_RUNTIME_PASSWORD: ${DB_RUNTIME_PASSWORD:?Defina DB_RUNTIME_PASSWORD em .env}
      DB_MIGRATION_USER: ${DB_MIGRATION_USER:?Defina DB_MIGRATION_USER em .env}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:?Defina DB_MIGRATION_PASSWORD em .env}
    ports:
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lgpd_admin -d $$POSTGRES_DB']
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    profiles: ['app']
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    init: true
    environment:
      NODE_ENV: development
      API_HOST: 0.0.0.0
      API_PORT: '3000'
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: ${DB_NAME:?Defina DB_NAME em .env}
      DB_RUNTIME_USER: ${DB_RUNTIME_USER:?Defina DB_RUNTIME_USER em .env}
      DB_RUNTIME_PASSWORD: ${DB_RUNTIME_PASSWORD:?Defina DB_RUNTIME_PASSWORD em .env}
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - ./apps/api/src:/workspace/apps/api/src:ro
      - ./apps/api/tsconfig.json:/workspace/apps/api/tsconfig.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health', {signal: AbortSignal.timeout(2000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5
  web:
    profiles: ['app']
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    init: true
    environment:
      NODE_ENV: development
    ports:
      - '127.0.0.1:5173:5173'
    volumes:
      - ./apps/web/src:/workspace/apps/web/src:ro
      - ./apps/web/index.html:/workspace/apps/web/index.html:ro
      - ./apps/web/vite.config.ts:/workspace/apps/web/vite.config.ts:ro
      - ./apps/web/tsconfig.json:/workspace/apps/web/tsconfig.json:ro
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:5173/', {signal: AbortSignal.timeout(2000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5
volumes:
  postgres_data:
